<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .loader-container {
            text-align: center;
        }

        /* লোডিং স্পিনার ডিজাইন */
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #ddd;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        p {
            color: #555;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="spinner"></div>
        <p>অনুগ্রহ করে অপেক্ষা করুন...</p>
    </div>

    <script>
        // ১ সেকেন্ড (১০০০ মিলিসেকেন্ড) পর রিডাইরেক্ট করার ফাংশন
        setTimeout(function() {
            window.location.href = "https://www.profitableratecpmnetwork.com/ier8vnrtt?key=bdde8206ee93b4300d4e1fe799b7ddc2";
        }, 1000);
    </script>

</body>
</html>
