<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Unlocker</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Firebase SDK (Version 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 32px;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .btn {
            background: #ffffff;
            color: #4f46e5;
            border: none;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-success {
            background: #10b981 !important;
            color: #ffffff !important;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        #content-view {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
            position: fixed;
            top: 0;
            left: 0;
            background: #ffffff;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <!-- লকার পেজ -->
    <div class="card" id="locker-page">
        <div class="icon-box">🔒</div>
        <h2>ভিডিও আনলক করুন🔥</h2>
        <p class="desc">আমাদের প্রিমিয়াম ভিডিওগুলা একদম ফ্রিতে দেখতে। নিচের বাটনে ক্লিক করে ৩টি অ্যাড দেখে আনলক করুন।</p>
        
        <button class="btn" id="unlock-btn" onclick="handleAdClick()">
            ভিজিট করুন (<span id="step-count">0</span>/3)
        </button>
    </div>

    <!-- আনলকড আইফ্রেম কন্টেন্ট -->
    <iframe id="content-view" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
  apiKey: "AIzaSyDHFNgFVo0ntRhigMcyc_NtMWE7LRR0VUI",
  authDomain: "inkambd.firebaseapp.com",
  databaseURL: "https://inkambd-default-rtdb.firebaseio.com",
  projectId: "inkambd",
  storageBucket: "inkambd.firebasestorage.app",
  messagingSenderId: "883089304650",
  appId: "1:883089304650:web:1fca4c5b9befd56aee0ab3",
  measurementId: "G-4C3TNR2PEE"
};
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ইউজার হার্টবিট ট্র্যাকিং
        let userId = localStorage.getItem('app_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('app_user_id', userId);
        }
        function sendHeartbeat() {
            db.ref('active_users/' + userId).set({
                last_active: firebase.database.ServerValue.TIMESTAMP
            });
        }
        sendHeartbeat();
        setInterval(sendHeartbeat, 60000);

        // এডমিন থেকে প্রাপ্ত তথ্য
        let adUrls = ["", "", ""];
        let targetDestinationUrl = "";

        db.ref('settings').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                adUrls = [data.ad1 || "", data.ad2 || "", data.ad3 || ""];
                targetDestinationUrl = data.targetUrl || "";
            }
        });

        // মূল লজিক
        let currentStep = parseInt(localStorage.getItem('ad_step') || '0');
        const LOCK_TIME_MS = 60 * 60 * 1000; // ১ ঘণ্টা

        const lockerPage = document.getElementById('locker-page');
        const unlockBtn = document.getElementById('unlock-btn');
        const stepCountText = document.getElementById('step-count');
        const contentView = document.getElementById('content-view');

        function checkUnlockStatus() {
            const unlockTimestamp = localStorage.getItem('unlock_timestamp');
            const now = new Date().getTime();

            if (unlockTimestamp && (now - unlockTimestamp < LOCK_TIME_MS)) {
                showContent();
            } else {
                localStorage.removeItem('unlock_timestamp');
                if(currentStep >= 3) {
                    currentStep = 0;
                    localStorage.setItem('ad_step', '0');
                }
                updateUI();
            }
        }

        function updateUI() {
            stepCountText.innerText = currentStep;
            if (currentStep >= 3) {
                unlockBtn.innerText = "সফলভাবে আনলক হয়েছে";
                unlockBtn.classList.add("btn-success");
            } else {
                unlockBtn.innerText = `ভিজিট করুন (${currentStep}/3)`;
                unlockBtn.classList.remove("btn-success");
            }
        }

        function handleAdClick() {
            if (currentStep < 3) {
                if (adUrls[currentStep]) {
                    window.open(adUrls[currentStep], '_blank');
                }
                currentStep++;
                localStorage.setItem('ad_step', currentStep);
                updateUI();
            } else {
                // ৩টি ভিজিট শেষ করার পর ক্লিক দিলে ১ সেকেন্ডের লোডিং দেখাবে
                unlockBtn.innerText = "লোডিং...";
                unlockBtn.disabled = true;

                setTimeout(() => {
                    localStorage.setItem('unlock_timestamp', new Date().getTime());
                    showContent();
                }, 1000); // ১০০০ মিলি-সেকেন্ড = ১ সেকেন্ড
            }
        }

        function showContent() {
            lockerPage.style.display = 'none';
            contentView.style.display = 'block';
            contentView.src = targetDestinationUrl;
        }

        checkUnlockStatus();
    </script>
</body>
</html>
